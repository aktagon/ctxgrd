# ctxgrd.toml — example configuration for the examples/ tree
#
# Each [<NAMESPACE>] heading assigns a flat list of rules to documents
# whose id begins with that namespace. Sub-tables supply rule params.
# Parameterized core.* rules read from the unified metadata map
# (frontmatter ∪ source `extra`, frontmatter wins), so the same rule
# works for local markdown docs and JIRA-sourced docs alike.

[ignore]
patterns = [
  "**/.*",
  "target/**",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/dist/**",
  "**/build/**",
  "**/log/**",
  "**/logs/**",
  "**/tmp/**",
]

# ───────────────────────── Sources ─────────────────────────

# Activates the jira-stub source discovered at sources/jira-stub/run.
# Without this table, the source exists on disk but is not invoked.
[sources.jira-stub]
project = "AUDIT"

# ───────────────────────── References (ADR-001 § REF-002) ─────────────────────────

# The reference scanner walks files matching `scan` for
# `<NAMESPACE>-<number>` tokens. Each match becomes an anonymous
# pointer that core.cross-ref checks against the document graph.
# REF-004: do NOT include `**/*.md` here — markdown documents are
# already tokenised by the markdown walker.
[references]
scan = [
  "refs/**/*.toml",
  "refs/**/*.go",
  "refs/**/*.rs",
]

# ───────────────────────── ADR ─────────────────────────

[ADR]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
  "adr.consequences-non-empty",
  "adr.supersession-consistent",
]

[ADR."core.required-headings"]
headings = ["Status", "Context", "Decision", "Consequences"]

[ADR."core.required-metadata"]
keys = ["id", "title", "status"]

[ADR."core.allowed-values"]
status = ["draft", "accepted", "rejected", "superseded"]

# ───────────────────────── PRD ─────────────────────────

[PRD]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
]

[PRD."core.required-headings"]
headings = ["Overview", "Goals", "Requirements", "Success metrics"]

[PRD."core.required-metadata"]
keys = ["id", "title", "status"]

[PRD."core.allowed-values"]
status = ["draft", "accepted", "rejected"]

# ───────────────────────── PMR ─────────────────────────

# post-mortem reports: same core rules but `incident_date` is a required
# metadata key — demonstrating that required-metadata is not limited to
# the standard keys (id/title/status).

[PMR]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
]

[PMR."core.required-headings"]
headings = ["Summary", "Impact", "Timeline", "Root Cause", "Action Items"]

[PMR."core.required-metadata"]
keys = ["id", "title", "status", "incident_date"]

# ───────────────────────── JIRA (via jira-stub source) ─────────────────────────

# JIRA tickets come from the source envelope — no body frontmatter — but
# their `extra` fields (status, assignee, …) flow into the unified
# metadata map, so `core.required-metadata` and `core.allowed-values`
# work the same way they do for file-based ADRs.
[JIRA]
rules = [
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.required-metadata",
  "core.allowed-values",
]

[JIRA."core.required-metadata"]
keys = ["status", "assignee"]

[JIRA."core.allowed-values"]
status = ["Open", "In Progress", "Closed"]

# ─────────────────────── PROMPT ─────────────────────────
#
# Reusable LLM prompts (global CLAUDE.md: docs/prompts/<NNN>-<name>.md).
# Mirrors the llm-agents pack's PROMPT namespace (ADR-013 § PACK-009).
# id-claim only: a prompt is linted once it carries `id: PROMPT-<n>`;
# frontmatter-less siblings like `*.test.md` stay silently skipped
# under intent classification (ADR-007 § DOC-001).
#
[PROMPT]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.required-headings",
  "core.required-metadata",
]

[PROMPT."core.required-headings"]
headings = ["System prompt", "Output format"]

[PROMPT."core.required-metadata"]
keys = ["id", "title"]

# ─────────────────────── AGENTS ─────────────────────────
#
# The always-loaded instruction files (CLAUDE.md / AGENTS.md). Path-claimed,
# not id-claim — these files exist in most repos, so the namespace fires on
# them deliberately (ADR-020 § ACX-001). The three `agents.*` rules are
# builtin-compiled (source: pack).
#
[AGENTS]
paths = ["CLAUDE.md", "AGENTS.md"]
rules = ["agents.context-headings", "agents.context-budget", "agents.context-cache"]

# ──────────────────────── TODO ──────────────────────────
#
# The repo-root TODO.md state file (`TODO.md`, not `**/TODO.md`). The two
# `todo.*` rules validate its freshness line and section structure.
#
[TODO]
paths = ["TODO.md"]
rules = ["todo.freshness", "todo.structure"]

[TODO."todo.freshness"]
stale_days = 30
