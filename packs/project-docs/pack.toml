# summary: ADR, PRD, RFC, BUG doc types plus the TODO state file and the README front door — engineering doc lifecycle with status vocabularies, required headings, and a README that links the entry guide.

[ADR]
paths = ["docs/adrs/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
  "core.successor-link",
]

[ADR."core.required-headings"]
headings = ["Status", "Context", "Requirements", "Consequences", "Open Questions", "References", "Change log"]

[ADR."core.required-metadata"]
keys = ["id", "title", "status", "date"]

[ADR."core.allowed-values"]
status = ["draft", "accepted", "rejected", "superseded"]

[PRD]
paths = ["docs/prds/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
  "core.successor-link",
  "ears.clause-syntax",
]

[PRD."core.required-headings"]
headings = ["Context", "Goals", "Non-goals", "User stories", "Requirements", "Definition of Done", "Open Questions", "References", "Change log"]

[PRD."core.required-metadata"]
keys = ["id", "title", "status"]

[PRD."core.allowed-values"]
status = ["draft", "accepted", "superseded"]

[RFC]
paths = ["docs/rfcs/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
]

# Headings track the author-written [Required] sections of RFC 7322 §4
# (the RFC Style Guide; see the 7322bis draft for the current structure:
# https://www.ietf.org/archive/id/draft-flanagan-7322bis-07.html#name-structure-of-an-rfc):
# Abstract, Introduction, Security Considerations,
# References. The document body (§3-6) is free-form and not a fixed heading;
# Editor-supplied / IETF-publication sections (Status of This Memo, Copyright,
# Table of Contents, IANA Considerations, Author's Address) are intentionally
# omitted — they would false-positive on an internal proposal doc.
[RFC."core.required-headings"]
headings = ["Abstract", "Introduction", "Security Considerations", "References"]

[RFC."core.required-metadata"]
keys = ["id", "title", "status"]

[RFC."core.allowed-values"]
status = ["draft", "accepted", "rejected", "superseded"]

[BUG]
paths = ["docs/bugs/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
]

[BUG."core.required-headings"]
headings = ["Summary", "Repro", "Root cause", "Fix"]

[BUG."core.required-metadata"]
keys = ["id", "title", "status"]

[BUG."core.allowed-values"]
status = ["open", "fixed", "wontfix", "invalid", "duplicate"]

[TODO]
paths = ["TODO.md"]
rules = ["todo.freshness", "todo.structure"]

[TODO."todo.freshness"]
stale_days = 30

# README — the repo's front door. Path-claimed on the root README.md, id-less and
# frontmatter-free (READMEs open with an H1, not YAML). core.min-docs nudges a
# project that has none to write one. core.requires-link keeps the front door
# pointing at the entry guide: when docs/guides/getting-started.md exists (the GUIDE
# pack convention, ADR-055), the README must link it — a markdown link or an @import
# satisfies it. The target is skip-if-missing and warning-severity, so a project that
# adopts project-docs without the guide pack is untouched; retarget or drop the line
# if your entry guide lives elsewhere.
[README]
paths = ["README.md"]
rules = ["core.min-docs", "core.requires-link"]

[README."core.requires-link"]
targets = ["docs/guides/getting-started.md"]
severity = "warning"
