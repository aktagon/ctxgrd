# summary: ADR, PRD, ROADMAP, RFC, BUG doc types plus the TODO state file and the README front door — engineering doc lifecycle with status vocabularies, required headings, and a README that links the entry guide.

[ADR]
paths = ["docs/adrs/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.dep-status",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
  "core.successor-link",
  "core.acceptance-complete",
  "core.link-resolved",
]

[ADR."core.required-headings"]
headings = ["Status", "Context", "Requirements", "Consequences", "Open Questions", "References", "Change log"]

# An accepted/rejected/superseded ADR must resolve every `- [ ]` checkbox under
# Open Questions (ADR-099). ADRs carry neither Acceptance nor Definition of Done,
# so scan Open Questions instead of the rule's default headings.
#
# `require_checkboxes` below extends that to plain `-`/`*` bullets, so read the
# two settings together: with the flag on, a prose bullet under Open Questions
# is an error too. Lines inside fenced code blocks and thematic breaks
# (`- - -`) are excluded — an example is not a question.
#
# Two known gaps, both deliberate: `1.` numbered items and `+` bullets are not
# counted (widening the match would fail previously-clean documents — BUG-055),
# and `rejected` is not a terminal status here, so a rejected ADR is never
# gated at all.
[ADR."core.acceptance-complete"]
headings = ["Open Questions"]
# ADR-122 § ACC-006. Without this the rule only sees GFM task items, so an Open
# Questions section written as prose bullets is invisible and the ADR reports
# clean because nothing is *checkable* — not because anything is resolved. That
# was the dominant case: 94 of ctxgrd's own 119 terminal ADRs, making the
# ADR-099 binding ~93% inert in the repo that shipped it.
#
# Shipped ON in the pack because a greenfield project pays nothing for it — it
# has no ADRs yet, so there is no migration, and `ctxgrd init` gives it a check
# that works from the first document. An existing repo is unaffected until it
# runs `pack migrate` (copy-not-reference, ADR 013 § PACK-001), and adoption is
# consumer-initiated precisely so the migration lands when that repo chooses.
require_checkboxes = true

[ADR."core.required-metadata"]
keys = ["id", "title", "status", "date"]

[ADR."core.allowed-values"]
status = ["draft", "accepted", "rejected", "superseded"]

[PRD]
paths = ["docs/prds/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.dep-status",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
  "core.successor-link",
  "ears.clause-syntax",
  "core.min-docs",
  "core.link-resolved",
]

[PRD."core.required-headings"]
headings = ["Context", "Goals", "Non-goals", "User stories", "Requirements", "Definition of Done", "Open Questions", "References", "Change log"]

[PRD."core.required-metadata"]
keys = ["id", "title", "status"]

[PRD."core.allowed-values"]
status = ["draft", "accepted", "superseded"]

# ROADMAP — Now-Next-Later initiatives (ADR-088). One id-claimed file per
# initiative; the NNL horizon is carried as `status`, and cross-initiative
# blocking rides `depends_on` (core.dep-resolved/dep-cycle) rather than a
# "Dependencies" heading. Mandatory when enabled (core.min-docs, RDM-006) —
# a project that claims ROADMAP but writes no initiatives drops the rule or
# does not claim the namespace, mirroring the [README] precedent.
[ROADMAP]
paths = ["docs/roadmap/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
  "core.min-docs",
]

[ROADMAP."core.required-headings"]
headings = ["Problem", "Outcome", "Ideas", "Success Metrics"]

[ROADMAP."core.required-metadata"]
keys = ["id", "title", "status", "date", "owner"]

[ROADMAP."core.allowed-values"]
status = ["now", "next", "later", "done", "dropped"]

[RFC]
paths = ["docs/rfcs/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.dep-status",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
]

# Headings track the author-written [Required] sections of RFC 7322 §4
# (the RFC Style Guide; see the 7322bis draft for the current structure:
# https://www.ietf.org/archive/id/draft-flanagan-7322bis-07.html#name-structure-of-an-rfc):
# Abstract, Introduction, Security Considerations,
# References. The document body (§3-6) is free-form and not a fixed heading;
# Editor-supplied / IETF-publication sections (Status of This Memo, Copyright,
# Table of Contents, IANA Considerations, Author's Address) are intentionally
# omitted — they would false-positive on an internal proposal doc.
[RFC."core.required-headings"]
headings = ["Abstract", "Introduction", "Security Considerations", "References"]

[RFC."core.required-metadata"]
keys = ["id", "title", "status"]

[RFC."core.allowed-values"]
status = ["draft", "accepted", "rejected", "superseded"]

[BUG]
paths = ["docs/bugs/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
  "core.link-resolved",
]

[BUG."core.required-headings"]
headings = ["Summary", "Repro", "Root cause", "Fix"]

[BUG."core.required-metadata"]
keys = ["id", "title", "status"]

[BUG."core.allowed-values"]
status = ["open", "fixed", "wontfix", "invalid", "duplicate"]

# core.file-budget (ADR-109 § BDG-004): TODO.md is the file that grows without
# bound — appended to every session, never pruned — and the one a reader hits a
# ceiling on first. The default budget is 150000 characters (Claude Code's own
# read-time warning threshold); set `max_chars` below to tighten it.
[TODO]
paths = ["TODO.md"]
rules = ["todo.freshness", "todo.structure", "core.file-budget"]

[TODO."todo.freshness"]
stale_days = 30

# README — the repo's front door. Path-claimed on the root README.md, id-less and
# frontmatter-free (READMEs open with an H1, not YAML). core.min-docs nudges a
# project that has none to write one. core.requires-link keeps the front door
# pointing at the entry guide: when docs/guides/getting-started.md exists (the GUIDE
# pack convention, ADR-055), the README must link it — a markdown link or an @import
# satisfies it. The target is skip-if-missing and warning-severity, so a project that
# adopts project-docs without the guide pack is untouched; retarget or drop the line
# if your entry guide lives elsewhere.
[README]
paths = ["README.md"]
rules = ["core.min-docs", "core.requires-link", "core.link-resolved"]

[README."core.requires-link"]
targets = ["docs/guides/getting-started.md"]
severity = "warning"
