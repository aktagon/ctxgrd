# summary: design — structural linting for the two root design-context files a design agent reads before it works: DESIGN.md (the visual system — how it looks) and PRODUCT.md (the strategy — register, platform, users, purpose, positioning, who/what/why).
#
# For DESIGN.md semantic checks (WCAG contrast, orphaned tokens,
# missing-primary), use @google/design.md lint. ctxgrd handles structure;
# @google/design.md handles visual/semantic validity. See ADR-027 § DES-005.
#
# Both namespaces are path-claimed id-less singletons, so an absent file is
# silent (DOC-001) — neither binds core.min-docs, and a project that keeps only
# one of the two pays nothing for the other. ADR-104.

[DESIGN]
paths = ["DESIGN.md"]
rules = [
    "core.frontmatter",
    "core.required-metadata",
    "design.section-order",
    "design.token-ref",
]

[DESIGN."core.required-metadata"]
keys = ["name"]

# PRODUCT — the strategic half: register, users, purpose, positioning,
# personality, anti-references, principles, accessibility. Unlike DESIGN.md it
# carries no YAML frontmatter, so core.frontmatter is deliberately unbound.
#
# The heading list omits Register and Platform on purpose: product.register owns
# their presence *and* their values, and Platform is legitimately absent (it
# means `web`). Conversion & Proof is likewise omitted — it is conditional on
# the register, which required-headings cannot express. ADR-104.
[PRODUCT]
paths = ["PRODUCT.md"]
rules = ["product.register", "core.required-headings"]

[PRODUCT."core.required-headings"]
headings = [
    "Users",
    "Product Purpose",
    "Positioning",
    "Brand Personality",
    "Anti-references",
    "Design Principles",
    "Accessibility & Inclusion",
]
