# summary: GDPR documentary artifacts (ROPA/DPIA/DPA) over the security base — Regulation (EU) 2016/679 Arts. 28/30/35. Paperwork existence/metadata/freshness only, never legal adequacy.
# depends: security

# Records of processing activities (GDPR Art. 30). Each record declares the controller/processor role, an Art. 6(1) lawful basis from the closed vocabulary, the data categories processed, and a retention period — the highest-value defects a ROPA can catch are an undeclared role or an absent/mistyped lawful basis. Path-claim, but carries an `id` (core.id) so DPIAs and DPAs resolve as cross-ref targets. gdpr.processor-dpa (GDPR-002) adds the conditional cross-ref: a processor-role record must link its governing DPA (the Art. 28 agreement).
[ROPA]
paths = ["docs/compliance/gdpr/ropa/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.cross-ref",
  "core.required-metadata",
  "core.allowed-values",
  "gdpr.processor-dpa",
]

[ROPA."core.required-metadata"]
keys = ["id", "title", "status", "controller_or_processor", "lawful_basis", "data_categories", "retention"]

[ROPA."core.allowed-values"]
controller_or_processor = ["controller", "processor", "joint-controller"]
lawful_basis = ["consent", "contract", "legal_obligation", "vital_interests", "public_task", "legitimate_interests"]

# Data protection impact assessments (GDPR Art. 35). A DPIA assesses high-risk processing and must be re-reviewed when that processing changes; `reviewed_date` under core.calendar-freshness flags one stale past a year. Cross-refs the ROPA activity it assesses.
[DPIA]
paths = ["docs/compliance/gdpr/dpia/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.cross-ref",
  "core.required-metadata",
  "core.calendar-freshness",
]

[DPIA."core.required-metadata"]
keys = ["id", "title", "status", "reviewed_date"]

[DPIA."core.calendar-freshness"]
field = "reviewed_date"
stale_days = 365

# Processor / subprocessor agreement register (GDPR Art. 28). Each entry records the contracting party and the execution date, making the processing relationship auditable. Path-claim with an `id` so a processor-role ROPA can cross-ref its governing DPA.
[DPA]
paths = ["docs/compliance/gdpr/dpa/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.cross-ref",
  "core.required-metadata",
]

[DPA."core.required-metadata"]
keys = ["id", "title", "status", "party", "executed_date"]
