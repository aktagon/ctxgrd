# summary: SOC 2 control-to-evidence register (SOC2) over the security base — AICPA Trust Services Criteria (2017, rev. 2022): the mandatory Common Criteria CC1-CC9 plus the optional Availability/Confidentiality/Processing-Integrity/Privacy categories. Paperwork existence/metadata/freshness only, never operating-effectiveness adequacy.
# depends: security

# SOC 2 control-to-evidence register (AICPA Trust Services Criteria, SOC-001/002/003). Each entry maps one Trust Services criterion (from the closed catalog, projected into core.allowed-values) to its implementing control and operating-effectiveness evidence — a reused POLICY, an ADR, or an `evidence_link` (an access-review log, change ticket, or config export). SOC 2 introduces no statutory document namespace of its own; the criterion-to-control-to-evidence mapping is its sole artifact, reusing POLICY/RISK/VULN from the security base. Path-claim with an `id` so an audit or a cross-ref can resolve a control. core.calendar-freshness over `review_date` surfaces a stale control (the Type I / Type II distinction lives at the freshness layer: a stale review is a point-in-time snapshot masquerading as period evidence). soc2.control-evidence (SOC-002) reuses the hipaa.safeguard-evidence conditional machinery: an in-scope control asserting a criterion with neither a POLICY/ADR cross-ref nor a non-empty `evidence_link` fails; a `not-applicable` control is out of scope.
[SOC2]
paths = ["docs/compliance/soc2/controls/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.cross-ref",
  "core.required-metadata",
  "core.allowed-values",
  "core.calendar-freshness",
  "soc2.control-evidence",
]

[SOC2."core.required-metadata"]
keys = ["id", "title", "status", "criterion", "owner", "category", "review_date"]

[SOC2."core.allowed-values"]
criterion = ["CC1.1", "CC1.2", "CC1.3", "CC1.4", "CC1.5", "CC2.1", "CC2.2", "CC2.3", "CC3.1", "CC3.2", "CC3.3", "CC3.4", "CC4.1", "CC4.2", "CC5.1", "CC5.2", "CC5.3", "CC6.1", "CC6.2", "CC6.3", "CC6.4", "CC6.5", "CC6.6", "CC6.7", "CC6.8", "CC7.1", "CC7.2", "CC7.3", "CC7.4", "CC7.5", "CC8.1", "CC9.1", "CC9.2", "A1.1", "A1.2", "A1.3", "C1.1", "C1.2", "PI1.1", "PI1.2", "PI1.3", "PI1.4", "PI1.5", "P1.1", "P2.1", "P3.1", "P3.2", "P4.1", "P4.2", "P4.3", "P5.1", "P5.2", "P6.1", "P6.2", "P6.3", "P6.4", "P6.5", "P6.6", "P6.7", "P7.1", "P8.1"]
category = ["CC", "A", "C", "PI", "P"]

[SOC2."core.calendar-freshness"]
field = "review_date"
stale_days = 365

[SOC2."soc2.control-evidence"]
evidence-fields = ["evidence_link"]
out-of-scope-status = ["not-applicable"]
