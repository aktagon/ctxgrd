# summary: AGENTS — the AGENTS.md cross-tool instruction standard (agents.md).
# The context-* rules keep an always-loaded instruction file free of volatile
# state, within budget, and cache-friendly. One owner for AGENTS.md so it never
# conflicts with the per-harness packs. ADR-051 split the old catch-all `agents`
# pack (ADR-023) into this + `workflow` + the per-harness packs.

# AGENTS.md is read by many harnesses (Codex, opencode, and others adopting the
# agents.md standard). It is a single shared file, so exactly one namespace
# claims it — harness-specific instruction files (CLAUDE.md, GEMINI.md) live in
# their own packs.
[AGENTS]
paths = ["AGENTS.md"]
rules = ["agents.context-headings", "agents.context-budget", "agents.context-cache", "writing.ai-fingerprints"]

# [AGENTS."agents.context-budget"]
# max_words = 4000        # instruction-file size budget (default 4000)
# [AGENTS."agents.context-cache"]
# churn_min_hours = 0     # >0 enables the commit-context churn warning
