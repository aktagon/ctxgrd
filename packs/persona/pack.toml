# summary: SOUL.md/STYLE.md persona linting — section presence, order, and pairing
# SOUL.md / STYLE.md is a community convention (github.com/aaronjmars/soul.md,
# MIT) for describing an AI agent's persona (SOUL.md, identity) and voice
# (STYLE.md). ctxgrd lints structure only: SOUL.md's high-signal sections,
# STYLE.md section order (advisory), and the recommended SOUL.md sibling.
# The load-bearing quality tests — STYLE.md's rules-vs-adjectives and SOUL.md's
# prediction test — are semantic and are NOT linted; validate them by running
# prompts through a model (the spec's own method). See ADR-034 § STY-005 and
# ADR-035 § SOUL-005.

[SOUL]
paths = ["SOUL.md", "soul/SOUL.md"]
rules = [
    "core.frontmatter",
    "soul.sections",
]

[STYLE]
paths = ["STYLE.md"]
rules = [
    "core.frontmatter",
    "style.section-order",
    "style.soul-pair",
]
