# summary: ISO 27001 control-to-evidence register (ISO27001) over the security base — ISO/IEC 27001:2022 Annex A: 93 controls across the Organizational/People/Physical/Technological themes. Paperwork existence/metadata/freshness only, never implementation adequacy.
# depends: security

# ISO 27001 control-to-evidence register (ISO/IEC 27001:2022 Annex A, ISO-001/002/003). Each entry maps one Annex A control (from the closed catalog, projected into core.allowed-values) to its implementing evidence — a reused POLICY, an ADR, or an `evidence_link`. ISO 27001 introduces no statutory document namespace of its own; the control-to-evidence mapping is its sole artifact, reusing POLICY/RISK/VULN from the security base. Path-claim with an `id` so an audit or a cross-ref can resolve a control. core.calendar-freshness over `reviewed_date` surfaces a stale control. The Statement of Applicability's applicable/not-applicable decision rides the control `status`: a `not-applicable` control is out of scope. iso27001.control-evidence (ISO-002) reuses the shared conditional-evidence machinery: an in-scope control asserting an Annex A control with neither a POLICY/ADR cross-ref nor a non-empty `evidence_link` fails. The `status` vocabulary is deliberately open (ADR-114 § STV-001) — a program's lifecycle words are its own — with one machine-read exception: the `out-of-scope-status` value must be spelled `not-applicable` (case-insensitive), or the Statement-of-Applicability exemption does not apply and the control is held to the evidence requirement. The freshness field is `reviewed_date`, one spelling across this whole family (ADR-114 § FLD-001): it records when the review happened, which is what core.calendar-freshness ages.
[ISO27001]
paths = ["docs/compliance/iso-27001/controls/**"]
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.cross-ref",
  "core.required-metadata",
  "core.allowed-values",
  "core.calendar-freshness",
  "iso27001.control-evidence",
]

[ISO27001."core.required-metadata"]
keys = ["id", "title", "status", "control", "owner", "theme", "reviewed_date"]

[ISO27001."core.allowed-values"]
control = ["A.5.1", "A.5.2", "A.5.3", "A.5.4", "A.5.5", "A.5.6", "A.5.7", "A.5.8", "A.5.9", "A.5.10", "A.5.11", "A.5.12", "A.5.13", "A.5.14", "A.5.15", "A.5.16", "A.5.17", "A.5.18", "A.5.19", "A.5.20", "A.5.21", "A.5.22", "A.5.23", "A.5.24", "A.5.25", "A.5.26", "A.5.27", "A.5.28", "A.5.29", "A.5.30", "A.5.31", "A.5.32", "A.5.33", "A.5.34", "A.5.35", "A.5.36", "A.5.37", "A.6.1", "A.6.2", "A.6.3", "A.6.4", "A.6.5", "A.6.6", "A.6.7", "A.6.8", "A.7.1", "A.7.2", "A.7.3", "A.7.4", "A.7.5", "A.7.6", "A.7.7", "A.7.8", "A.7.9", "A.7.10", "A.7.11", "A.7.12", "A.7.13", "A.7.14", "A.8.1", "A.8.2", "A.8.3", "A.8.4", "A.8.5", "A.8.6", "A.8.7", "A.8.8", "A.8.9", "A.8.10", "A.8.11", "A.8.12", "A.8.13", "A.8.14", "A.8.15", "A.8.16", "A.8.17", "A.8.18", "A.8.19", "A.8.20", "A.8.21", "A.8.22", "A.8.23", "A.8.24", "A.8.25", "A.8.26", "A.8.27", "A.8.28", "A.8.29", "A.8.30", "A.8.31", "A.8.32", "A.8.33", "A.8.34"]
theme = ["Organizational", "People", "Physical", "Technological"]

[ISO27001."core.calendar-freshness"]
field = "reviewed_date"
stale_days = 365

[ISO27001."iso27001.control-evidence"]
evidence-fields = ["evidence_link"]
out-of-scope-status = ["not-applicable"]
