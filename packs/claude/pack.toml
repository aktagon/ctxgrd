# summary: CLAUDE/CLAUDESKILLS/CLAUDEAGENTS — the files proprietary to Claude Code: the CLAUDE.md instruction file, .claude/skills SKILL.md definitions, and .claude/agents subagent definitions.
# The shared AGENTS.md standard lives in the `agents` pack; ctxgrd's
# SPEC/TASK/PROMPT docs in `workflow`. Per-harness pack established by
# ADR-050/ADR-051.

# CLAUDE.md — Claude Code's always-loaded instruction file. Same context-* rules
# as the shared AGENTS.md (they are harness-agnostic), claimed here because the
# file is Claude-specific.
[CLAUDE]
paths = ["CLAUDE.md"]
rules = ["agents.context-headings", "agents.context-budget", "agents.context-cache", "writing.ai-fingerprints"]

# CLAUDESKILLS — Claude Code SKILL.md definitions (agentskills.io convention).
# Path-claimed, id-less: SKILL.md has name/description but no id:, so it lints via
# the compiled `skills.frontmatter` rule (core.* would error with IdMissing).
[CLAUDESKILLS]
paths = [".claude/skills/**/SKILL.md"]
rules = ["skills.frontmatter"]

# CLAUDEAGENTS — Claude Code subagent definitions (.claude/agents/*.md). Markdown
# with a name/description frontmatter and a system-prompt body; linted by the
# compiled `agent.frontmatter` rule (ADR-050; renamed from CLAUDECODE in ADR-061).
[CLAUDEAGENTS]
paths = [".claude/agents/**/*.md"]
rules = ["agent.frontmatter"]

