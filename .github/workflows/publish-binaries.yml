# Builds release binaries on tag push and attaches them to the
# corresponding GitHub Release. Lives in the public repo only.
#
# Source for this file is maintained in the upstream working repo at
# `public-release/.github/workflows/publish-binaries.yml`. Edit there;
# the next public release replaces this file from upstream.

name: Publish binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to upload assets to the GitHub Release

jobs:
  build:
    name: Build ${{ matrix.target.triple }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, triple: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, triple: x86_64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, triple: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, ext: zip }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target.triple }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME=ctxgrd
          TAG=${GITHUB_REF_NAME}
          PKG_NAME="${BIN_NAME}-${TAG}-${{ matrix.target.triple }}"
          PKG_DIR="dist/${PKG_NAME}"
          mkdir -p "${PKG_DIR}"
          cp "target/${{ matrix.target.triple }}/release/${BIN_NAME}" "${PKG_DIR}/"
          cp README.md LICENSE-MIT CHANGELOG.md "${PKG_DIR}/"
          # strip is best-effort: silently skip on platforms where it
          # can't run against the cross-compiled binary.
          strip "${PKG_DIR}/${BIN_NAME}" 2>/dev/null || true
          tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          echo "ASSET_PATH=dist/${PKG_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BIN_NAME = "ctxgrd.exe"
          $TAG = $env:GITHUB_REF_NAME
          $PKG_NAME = "ctxgrd-$TAG-${{ matrix.target.triple }}"
          $PKG_DIR = "dist/$PKG_NAME"
          New-Item -ItemType Directory -Force -Path $PKG_DIR | Out-Null
          Copy-Item "target/${{ matrix.target.triple }}/release/$BIN_NAME" $PKG_DIR
          Copy-Item README.md, LICENSE-MIT, CHANGELOG.md $PKG_DIR
          Compress-Archive -Path $PKG_DIR -DestinationPath "dist/$PKG_NAME.zip"
          "ASSET_PATH=dist/$PKG_NAME.zip" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          fail_on_unmatched_files: true
